name: NightEscort
options:
  bundleIdPrefix: app.nightescort
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # 后端地址和邀请域名：改这里，或在 xcodebuild 命令行覆盖
    API_BASE_URL: "http://localhost:8080"
    INVITE_HOST: "ye.example.com"
packages:
  EscortKit:
    path: Packages/EscortKit
targets:
  NightEscort:
    type: application
    platform: iOS
    sources:
      - NightEscort
      - Shared
      # 用户协议和隐私政策：和后端 /legal 网页同一份
      - path: ../backend/legal
        buildPhase: resources
    dependencies:
      - package: EscortKit
      - target: NightEscortWidgets
        embed: true
      - target: NightEscortWatch
    entitlements:
      path: NightEscort/NightEscort.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:$(INVITE_HOST)
        com.apple.security.application-groups:
          - group.app.nightescort
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: NightEscort/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleDisplayName: 安全回家
        NEApiBaseURL: $(API_BASE_URL)
        NEInviteHost: $(INVITE_HOST)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: 出发回家后才使用位置，只给这次选中守护你的人看，到家结束就停止。设定家庭地址时也会用一次，把地图定到你附近，不上传。
        NSCameraUsageDescription: 扫描好友的守护邀请二维码。
        NSPhotoLibraryUsageDescription: 从相册里识别邀请二维码。
        LSApplicationQueriesSchemes: [weixin, weixinULAPI]
        # 邀请落地页“打开「安全回家」”按钮：anquanhuijia://i/<token>（和 EscortKit InviteLink.appScheme、后端 APP_SCHEME 一致）
        CFBundleURLTypes:
          - CFBundleURLName: app.nightescort.ios.invite
            CFBundleURLSchemes: [anquanhuijia]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nightescort.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NightEscortWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NightEscortWidgets
      - Shared
    dependencies:
      - package: EscortKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NightEscortWidgets/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleDisplayName: 安全回家
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nightescort.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"

  NightEscortWatch:
    type: application
    platform: watchOS
    sources:
      - NightEscortWatch
      - Shared
    dependencies:
      - package: EscortKit
    entitlements:
      path: NightEscortWatch/NightEscortWatch.entitlements
      properties:
        aps-environment: development
    info:
      path: NightEscortWatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleDisplayName: 安全回家
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.nightescort.ios
        WKBackgroundModes: [location]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 护航时判断你是否到家，位置只在手表上用，不上传。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nightescort.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 第一版 MVP 端到端界面测试：App 连真后端，测试进程扮演好友（见 NightEscortUITests/MVPFlowTests.swift、scripts/mvp-e2e.sh）
  NightEscortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NightEscortUITests
    dependencies:
      - target: NightEscort
      - package: EscortKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nightescort.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NightEscort

schemes:
  NightEscortUITests:
    build:
      targets:
        NightEscort: all
        NightEscortUITests: [test]
    test:
      config: Debug
      targets:
        - NightEscortUITests
  NightEscort:
    build:
      targets:
        NightEscort: all
    test:
      targets: []
  NightEscortWatch:
    build:
      targets:
        NightEscortWatch: all
